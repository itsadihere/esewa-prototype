<title>eSewa MP — Upload Documents</title>
<link rel="stylesheet" href="css/style.css">

<div class="gov-strip" data-i18n="govt_mp">मध्य प्रदेश शासन</div>
<header class="site-header">
  <div class="bar">
    <a href="index.html" class="logo-badge" style="text-decoration:none">MP<br>eSEVA</a>
    <div class="brand">
      <h1 data-i18n="upload_title">दस्तावेज़ अपलोड करें</h1>
      <p class="muted" data-i18n="svc_info_title">मूल निवास प्रमाण पत्र</p>
    </div>
    <div class="header-actions"><button class="lang-toggle">English</button></div>
  </div>
</header>

<main class="page">
  <div class="alert info">
    <span>ℹ️</span>
    <div><span data-i18n="upload_hint">स्वीकार्य: PDF, JPG, PNG। स्वतः संपीड़ित व AI-जाँचित।</span>
      <span class="badge ai" data-i18n="ai_checked">AI जाँचित</span></div>
  </div>

  <div id="docCards"></div>

  <div class="sticky-cta">
    <div class="inner">
      <button class="btn block" id="proceedBtn" disabled data-i18n="proceed_payment">भुगतान हेतु आगे बढ़ें</button>
    </div>
  </div>
</main>
